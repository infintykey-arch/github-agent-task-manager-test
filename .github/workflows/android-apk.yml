name: Android APK

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    name: Build, test, and package debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run JVM unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Assemble installable debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK was produced
        id: verify-apk
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Run Android instrumented tests on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set +e
            gradle --no-daemon connectedDebugAndroidTest
            test_status=$?
            adb logcat -d -v threadtime > emulator-logcat.txt
            echo "--- Android runtime and instrumentation diagnostics ---"
            grep -E "FATAL EXCEPTION|AndroidRuntime|INSTRUMENTATION_STATUS|Process .* has died|Fatal signal|am_crash" emulator-logcat.txt | tail -n 300 || true
            exit "$test_status"

      - name: Upload Android test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TaskWake-android-test-diagnostics
          path: |
            emulator-logcat.txt
            app/build/reports/androidTests/connected/debug/
            app/build/outputs/androidTest-results/connected/debug/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK artifact
        if: always() && steps.verify-apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: TaskWake-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
